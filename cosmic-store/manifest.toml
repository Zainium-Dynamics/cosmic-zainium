# manifest.toml — cosmic-store (userland tier)

[package]
name             = "cosmic-store"
version          = "1.2.0"
description      = "App store for Zainium OS -- Alpine/Void musl packages into zexlib"
license          = "GPL-3.0-only"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/cosmic-store"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-store"]
tags             = ["desktop", "cosmic", "app", "store"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
