# manifest.toml — cosmic-sound-theme (userland tier)

[package]
name             = "cosmic-sound-theme"
version          = "1.7.0"
description      = "Sound theme for the COSMIC Desktop Environment"
license          = "CC-BY-SA-4.0"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-sound-theme"
build_type       = "noarch"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-sound-theme"]
tags             = ["desktop", "cosmic", "sound"]

[install]
share   = "/overlayer/syshub/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
