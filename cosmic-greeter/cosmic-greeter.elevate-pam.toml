# elevate-pam service stack for cosmic-greeter (production config path:
# /overlayer/syshub/etc/elevate-pam/services/cosmic-greeter.toml).
# Copied verbatim from the real stock file at
# ZAINIUM_DRIVE/zairoot/overlayer/syshub/etc/elevate-pam/services/cosmic-greeter.toml
# -- an earlier draft of this file (wrongly) dropped the [[session]]
# stanzas assuming quantra-logind handled that alone; the real stock
# file keeps them (env/limits/unix still run as PAM session hooks --
# quantra-logind separately does session *registration*, not instead of
# these).
# Auth: elevate-crypto via module unix. Session: quantra-logind.

[service]
name = "cosmic-greeter"
description = "COSMIC greeter — elevate-pam auth; session via quantra-logind"

[[auth]]
control = "required"
module = "env"
args = ["readenv=1"]

[[auth]]
control = "required"
module = "unix"

[[account]]
control = "required"
module = "unix"

[[password]]
control = "required"
module = "unix"

[[session]]
control = "required"
module = "env"

[[session]]
control = "required"
module = "limits"

[[session]]
control = "required"
module = "unix"
