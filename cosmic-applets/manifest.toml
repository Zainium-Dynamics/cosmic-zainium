# manifest.toml — cosmic-applets (syshub tier)

[package]
name             = "cosmic-applets"
version          = "1.7.0"
description      = "COSMIC panel applets, systemd/dbus/flatpak free"
license          = "GPL-3.0-only"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-applets"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-applets"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
