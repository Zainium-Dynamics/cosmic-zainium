# manifest.toml — limine (syshub tier)

[package]
name             = "limine"
version          = "12.9.3"
description      = "Limine bootloader (UEFI and BIOS) with Zainium's zaisys paths, and the limine install tool"
license          = "BSD-2-Clause"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/limine-bootloader/limine"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["limine"]
tags             = ["base", "boot"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
